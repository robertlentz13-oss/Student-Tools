<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Final Grade Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0f19;
      color: #f8fafc;
    }

    .calculator {
      width: 100%;
      max-width: 480px;
      padding: 32px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    /* Home button */
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 22px;
      padding: 9px 14px;
      border: 1px solid #263244;
      border-radius: 10px;
      background: #0f172a;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s;
    }

    .home-btn:hover {
      background: #1e293b;
      border-color: #6366f1;
      color: #f8fafc;
      transform: translateX(-2px);
    }

    .header {
      margin-bottom: 28px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .header p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #e2e8f0;
      font-size: 14px;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
    }

    input {
      width: 100%;
      padding: 14px 45px 14px 15px;
      border: 1px solid #334155;
      border-radius: 12px;
      outline: none;
      background: #0f172a;
      color: #f8fafc;
      font-size: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    input::placeholder {
      color: #64748b;
    }

    .unit {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      pointer-events: none;
    }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      background: #6366f1;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    }

    button:hover {
      background: #4f46e5;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .message.warning {
      display: block;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fcd34d;
    }

    .message.success {
      display: block;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 22px;
      text-align: center;
      background: #0f172a;
      border: 1px solid #263244;
      border-radius: 14px;
    }

    .result.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    .result-label {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .result-score {
      color: #818cf8;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .result-note {
      margin-top: 8px;
      color: #cbd5e1;
      font-size: 13px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .calculator {
        padding: 24px 20px;
      }

      .header h1 {
        font-size: 24px;
      }

      .result-score {
        font-size: 36px;
      }
    }
  </style>
</head>

<body>
  <main class="calculator">

    <!-- Home button -->
    <a
      href="https://robertlentz13-oss.github.io/Student-Tools/"
      class="home-btn"
    >
      ← Home
    </a>

    <div class="header">
      <h1>Final Grade Calculator</h1>
      <p>Find out exactly what score you need on your final exam.</p>
    </div>

    <form id="gradeForm">
      <div class="form-group">
        <label for="currentGrade">Current Grade</label>
        <div class="input-wrapper">
          <input type="number" id="currentGrade" placeholder="e.g. 82" min="0" max="100" step="any" />
          <span class="unit">%</span>
        </div>
      </div>

      <div class="form-group">
        <label for="desiredGrade">Desired Overall Grade</label>
        <div class="input-wrapper">
          <input type="number" id="desiredGrade" placeholder="e.g. 90" min="0" max="100" step="any" />
          <span class="unit">%</span>
        </div>
      </div>

      <div class="form-group">
        <label for="examWeight">Final Exam Weight</label>
        <div class="input-wrapper">
          <input type="number" id="examWeight" placeholder="e.g. 30" min="0" max="100" step="any" />
          <span class="unit">%</span>
        </div>
      </div>

      <button type="submit">Calculate</button>
    </form>

    <div id="message" class="message"></div>

    <div id="result" class="result">
      <div class="result-label">You need to score</div>
      <div id="score" class="result-score">0%</div>
      <div class="result-note">
        on your final exam to achieve your desired overall grade.
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById("gradeForm");
    const message = document.getElementById("message");
    const result = document.getElementById("result");
    const score = document.getElementById("score");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    function clearResults() {
      message.className = "message";
      message.textContent = "";
      result.classList.remove("show");
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      clearResults();

      const current = parseFloat(document.getElementById("currentGrade").value);
      const desired = parseFloat(document.getElementById("desiredGrade").value);
      const weight = parseFloat(document.getElementById("examWeight").value);

      if (Number.isNaN(current) || Number.isNaN(desired) || Number.isNaN(weight)) {
        showMessage("Please fill in all three fields.", "error");
        return;
      }

      if (current < 0 || current > 100) {
        showMessage("Current Grade must be between 0% and 100%.", "error");
        return;
      }

      if (desired < 0 || desired > 100) {
        showMessage("Desired Overall Grade must be between 0% and 100%.", "error");
        return;
      }

      if (weight <= 0 || weight > 100) {
        showMessage("Final Exam Weight must be greater than 0% and no more than 100%.", "error");
        return;
      }

      const examWeight = weight / 100;
      const requiredScore = (desired - current * (1 - examWeight)) / examWeight;
      const roundedScore = Math.round(requiredScore * 100) / 100;

      if (requiredScore <= 0) {
        score.textContent = "0%";
        result.classList.add("show");
        showMessage(
          "You have already reached your desired overall grade. Any score from 0% upward will keep you at or above your target.",
          "success"
        );
        return;
      }

      if (requiredScore > 100) {
        score.textContent = `${roundedScore}%`;
        result.classList.add("show");
        showMessage(
          `You would need ${roundedScore}% on the final, which is over 100%. Your desired overall grade is not achievable with the current grade and exam weight.`,
          "warning"
        );
        return;
      }

      score.textContent = `${roundedScore}%`;
      result.classList.add("show");

      showMessage(
        `You need at least ${roundedScore}% on the final exam to reach your target.`,
        "success"
      );
    });
  </script>
</body>
</html>
