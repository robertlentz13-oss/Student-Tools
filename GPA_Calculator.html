<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d16">

  <title>High School GPA Calculator</title>

  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --card-light: #151e2d;
      --border: #263244;
      --input: #0d1524;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      padding: 24px 16px 40px;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:
        radial-gradient(
          circle at top left,
          rgba(99, 102, 241, 0.12),
          transparent 35%
        ),
        var(--bg);
      color: var(--text);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 1050px;
      margin: auto;
    }

    /* ==============================
       HOME BUTTON
    ============================== */

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      margin-bottom: 20px;
      padding: 9px 14px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: var(--card);
      color: var(--muted);

      font-size: 13px;
      font-weight: 700;

      text-decoration: none;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    .home-btn:hover {
      background: #1e293b;
      border-color: var(--accent);
      color: var(--text);
      transform: translateX(-2px);
    }

    /* ==============================
       HEADER
    ============================== */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: clamp(26px, 4vw, 36px);
      line-height: 1.1;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ==============================
       GPA SCALE
    ============================== */

    .scale-control {
      display: flex;
      gap: 5px;
      padding: 5px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      flex-shrink: 0;
    }

    .scale-control button {
      border: 0;
      border-radius: 8px;
      padding: 10px 13px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .scale-control button.active {
      background: var(--accent);
      color: white;
    }

    /* ==============================
       SUMMARY
    ============================== */

    .summary {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .summary-card {
      min-height: 120px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
    }

    .summary-card.primary {
      background:
        linear-gradient(
          145deg,
          rgba(99, 102, 241, 0.18),
          transparent
        ),
        var(--card);
    }

    .summary-label {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .gpa-value {
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
    }

    .summary-number {
      font-size: 25px;
      font-weight: 750;
    }

    /* ==============================
       COURSES CONTAINER
    ============================== */

    .courses-card {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .courses-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 20px 22px;
      border-bottom: 1px solid var(--border);
    }

    .courses-header h2 {
      font-size: 18px;
    }

    .add-btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 15px;
      background: var(--accent);
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .add-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    /* ==============================
       DESKTOP TABLE
    ============================== */

    .table-head {
      display: grid;
      grid-template-columns:
        minmax(180px, 1.5fr)
        130px
        minmax(150px, 1fr)
        50px;

      gap: 12px;
      padding: 13px 22px;

      background: #0d1524;
      color: var(--muted);

      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #courses {
      padding: 0 22px;
    }

    .course-row {
      display: grid;
      grid-template-columns:
        minmax(180px, 1.5fr)
        130px
        minmax(150px, 1fr)
        50px;

      gap: 12px;
      align-items: center;

      padding: 14px 0;
      border-bottom: 1px solid rgba(38, 50, 68, 0.7);

      animation: courseIn 0.2s ease;
    }

    .course-row:last-child {
      border-bottom: 0;
    }

    /* ==============================
       INPUTS
    ============================== */

    input,
    select {
      width: 100%;
      height: 44px;

      padding: 0 12px;

      border: 1px solid #334155;
      border-radius: 10px;

      outline: none;

      background: var(--input);
      color: var(--text);

      font-size: 14px;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow:
        0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    select {
      cursor: pointer;
    }

    /* ==============================
       DELETE
    ============================== */

    .delete-btn {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 10px;

      background: rgba(239, 68, 68, 0.08);
      color: #f87171;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .delete-btn:hover {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.5);
      color: white;
    }

    /* ==============================
       FOOTER
    ============================== */

    .footer-note {
      margin-top: 14px;
      color: #64748b;
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
    }

    /* ==============================
       ANIMATION
    ============================== */

    @keyframes courseIn {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =====================================================
       TABLET / PHONE
    ===================================================== */

    @media (max-width: 760px) {

      body {
        padding: 18px 12px 35px;
      }

      .header {
        flex-direction: column;
        align-items: stretch;
      }

      .scale-control {
        width: 100%;
      }

      .scale-control button {
        flex: 1;
      }

      .summary {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .summary-card.primary {
        grid-column: 1 / -1;
      }

      .table-head {
        display: none;
      }

      #courses {
        padding: 12px;
      }

      .course-row {
        display: grid;

        grid-template-columns:
          minmax(0, 1fr)
          minmax(0, 1.3fr)
          44px;

        gap: 10px;

        padding: 14px;

        margin-bottom: 10px;

        background: var(--card-light);

        border: 1px solid var(--border);
        border-radius: 14px;
      }

      .course-row:last-child {
        margin-bottom: 0;
      }

      .course-name {
        grid-column: 1 / -1;
      }

      .grade {
        grid-column: 1;
      }

      .course-type {
        grid-column: 2;
      }

      .delete-btn {
        grid-column: 3;
        width: 44px;
        height: 44px;
      }
    }

    /* =====================================================
       SMALL PHONES
    ===================================================== */

    @media (max-width: 430px) {

      body {
        padding: 14px 9px 30px;
      }

      .home-btn {
        margin-bottom: 16px;
      }

      .header h1 {
        font-size: 27px;
      }

      .header p {
        font-size: 13px;
      }

      .summary {
        gap: 8px;
      }

      .summary-card {
        min-height: 95px;
        padding: 15px;
        border-radius: 14px;
      }

      .gpa-value {
        font-size: 36px;
      }

      .summary-number {
        font-size: 21px;
      }

      .courses-card {
        border-radius: 15px;
      }

      .courses-header {
        padding: 15px;
      }

      .courses-header h2 {
        font-size: 16px;
      }

      .add-btn {
        padding: 9px 11px;
        font-size: 13px;
      }

      #courses {
        padding: 9px;
      }

      .course-row {
        grid-template-columns:
          minmax(0, 1fr)
          minmax(0, 1.25fr)
          40px;

        gap: 8px;

        padding: 12px;
        border-radius: 13px;
      }

      input,
      select {
        height: 44px;
        font-size: 13px;
        padding-left: 10px;
        padding-right: 8px;
      }

      .delete-btn {
        width: 40px;
        height: 44px;
      }
    }

    /* =====================================================
       VERY NARROW PHONES
    ===================================================== */

    @media (max-width: 340px) {

      .course-row {
        grid-template-columns: 1fr 44px;
      }

      .course-name {
        grid-column: 1 / -1;
      }

      .grade {
        grid-column: 1;
      }

      .course-type {
        grid-column: 1;
      }

      .delete-btn {
        grid-column: 2;
        grid-row: 3;
      }

      .scale-control button {
        padding: 9px 5px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- HOME BUTTON -->
    <a
      href="https://robertlentz13-oss.github.io/Student-Tools/"
      class="home-btn"
    >
      ← Home
    </a>


    <!-- HEADER -->
    <header class="header">

      <div>
        <h1>High School GPA Calculator</h1>

        <p>
          Add your courses and grades to calculate your GPA instantly.
        </p>
      </div>

      <div class="scale-control">

        <button
          id="unweightedBtn"
          class="active"
          type="button"
        >
          Unweighted 4.0
        </button>

        <button
          id="weightedBtn"
          type="button"
        >
          Weighted 5.0
        </button>

      </div>

    </header>


    <!-- SUMMARY -->
    <section class="summary">

      <div class="summary-card primary">

        <div class="summary-label">
          Overall GPA
        </div>

        <div
          class="gpa-value"
          id="gpaValue"
        >
          0.00
        </div>

      </div>


      <div class="summary-card">

        <div class="summary-label">
          Courses
        </div>

        <div
          class="summary-number"
          id="courseCount"
        >
          0
        </div>

      </div>


      <div class="summary-card">

        <div class="summary-label">
          Total Grade Points
        </div>

        <div
          class="summary-number"
          id="totalPoints"
        >
          0.00
        </div>

      </div>

    </section>


    <!-- COURSES -->
    <section class="courses-card">

      <div class="courses-header">

        <h2>Your Courses</h2>

        <button
          class="add-btn"
          id="addCourseBtn"
          type="button"
        >
          + Add Course
        </button>

      </div>


      <!-- DESKTOP HEADERS -->
      <div class="table-head">

        <div>Course Name</div>
        <div>Grade</div>
        <div>Course Type</div>
        <div></div>

      </div>


      <div id="courses"></div>

    </section>


    <p class="footer-note">
      Standard 4.0 scale. Honors courses add 0.5 points
      and AP/IB courses add 1.0 point in Weighted mode.
    </p>

  </main>


  <script>

    const coursesContainer =
      document.getElementById("courses");

    const addCourseBtn =
      document.getElementById("addCourseBtn");

    const unweightedBtn =
      document.getElementById("unweightedBtn");

    const weightedBtn =
      document.getElementById("weightedBtn");

    const gpaValue =
      document.getElementById("gpaValue");

    const courseCount =
      document.getElementById("courseCount");

    const totalPoints =
      document.getElementById("totalPoints");


    let weighted = false;


    /*
      Base GPA values.
    */

    const gradePoints = {
      A: 4.0,
      B: 3.0,
      C: 2.0,
      D: 1.0,
      F: 0.0
    };


    /*
      Weighted bonuses.
    */

    const courseTypes = {
      "Regular": 0,
      "Honors": 0.5,
      "AP / IB": 1.0
    };


    /*
      Create course.
    */

    function createCourse() {

      const row =
        document.createElement("div");

      row.className = "course-row";


      row.innerHTML = `

        <input
          class="course-name"
          type="text"
          placeholder="Course name"
          aria-label="Course name"
        >

        <select
          class="grade"
          aria-label="Letter grade"
        >
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
          <option value="F">F</option>
        </select>

        <select
          class="course-type"
          aria-label="Course type"
        >
          <option value="Regular">
            Regular
          </option>

          <option value="Honors">
            Honors (+0.5)
          </option>

          <option value="AP / IB">
            AP / IB (+1.0)
          </option>
        </select>

        <button
          class="delete-btn"
          type="button"
          aria-label="Delete course"
          title="Delete course"
        >
          ×
        </button>
      `;


      /*
        Recalculate when
        anything changes.
      */

      row
        .querySelectorAll("input, select")
        .forEach(element => {

          element.addEventListener(
            "input",
            calculateGPA
          );

          element.addEventListener(
            "change",
            calculateGPA
          );

        });


      /*
        Delete button.
      */

      row
        .querySelector(".delete-btn")
        .addEventListener(
          "click",
          () => {

            row.remove();

            calculateGPA();

          }
        );


      coursesContainer.appendChild(row);

      calculateGPA();
    }


    /*
      Calculate GPA.
    */

    function calculateGPA() {

      const rows =
        [...document.querySelectorAll(".course-row")];

      let points = 0;

      let count = 0;


      rows.forEach(row => {

        const grade =
          row.querySelector(".grade").value;

        const type =
          row.querySelector(".course-type").value;


        let coursePoints =
          gradePoints[grade];


        if (weighted) {

          coursePoints +=
            courseTypes[type];

        }


        points += coursePoints;

        count++;

      });


      const gpa =
        count === 0
          ? 0
          : points / count;


      const maximum =
        weighted ? 5 : 4;


      gpaValue.textContent =
        Math.min(gpa, maximum).toFixed(2);


      courseCount.textContent =
        count;


      totalPoints.textContent =
        points.toFixed(2);
    }


    /*
      Switch GPA scale.
    */

    function setScale(value) {

      weighted = value;

      unweightedBtn.classList.toggle(
        "active",
        !weighted
      );

      weightedBtn.classList.toggle(
        "active",
        weighted
      );

      calculateGPA();
    }


    /*
      Buttons.
    */

    addCourseBtn.addEventListener(
      "click",
      createCourse
    );


    unweightedBtn.addEventListener(
      "click",
      () => setScale(false)
    );


    weightedBtn.addEventListener(
      "click",
      () => setScale(true)
    );


    /*
      Initial courses.
    */

    createCourse();
    createCourse();
    createCourse();

  </script>

</body>
</html>
